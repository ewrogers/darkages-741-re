comments:
  - address: "0x00467912"
    text: "Copy the current modifier mask into double-right-click pointer event type 5 at Event +0x18."
  - address: "0x005D48E5"
    text: "When Shift is held, skip every hit object whose broad category is not 8. Humans use category 1 and monsters or Mundanes use category 2, so their type-5 event normally falls through to the ground turn-or-step path."
  - address: "0x005E1B94"
    text: "Pointer types 1 and 2 both become ordinary living-object action 4; double-left has no distinct packet behavior."
  - address: "0x005E1BDA"
    text: "Pointer event type 5 becomes living-object action 6. Pass its coordinates, timestamp, and Event +0x18 modifier byte into the message builder."
  - address: "0x005E22F1"
    text: "Store the pointer modifier byte at living-object message +0x2C. Shift remains bit 0x04 when WorldPane handles action 6."
  - address: "0x005E49FC"
    text: "Static internal side 1 is the left layer and becomes wire side 0; internal side 0 is the right layer and becomes wire side 1."
  - address: "0x005EF0C6"
    text: "World-object message 0x50001 is a clicked static object, not an empty-ground click."
  - address: "0x005EF2C6"
    text: "UserClickMode suppresses ordinary category-1 player interaction only; NPC and monster categories are not gated here."
  - address: "0x005EF33A"
    text: "Living-object action 6 passes another object's nonzero u32 ID into native pursue-and-attack behavior. A dispatcher extension can admit Shift type 5 for living categories, after which Shift bit 0x04 remains available at message +0x2C."
  - address: "0x005EF9CB"
    text: "Timer ID 10 is the entity-pursuit retry. The callback's target ID is used only when its saved generation still equals WorldPane +0x2C8."
  - address: "0x005EFD29"
    text: "A ground right-click starts an exact-tile path only when Ctrl bit 0x02 and Shift bit 0x04 are both clear. Shift+right instead reaches the later one-step direction branch with modifier mask 0x24."
  - address: "0x005EFDC9"
    text: "A plain right-button ground action fully resets the previous route and pursuit before building an exact-tile path."
  - address: "0x005F0184"
    text: "Query the destination cell's current world-object list. Live human and monster passability is evaluated for every path expansion and every attempted queued step."
  - address: "0x005F04AF"
    text: "Read live static objects in the current and destination cells, obtain their replacement tile IDs, and apply direction-specific SOTP collision flags."
  - address: "0x005F484C"
    text: "Opcode 0x43 subtype 3 writes u16 tile X, u16 tile Y, and one static-side byte."
  - address: "0x005F4920"
    text: "Argument 0 increments the pursuit generation and invalidates outstanding timer callbacks. Argument 1 deliberately preserves the generation."
  - address: "0x005F49E5"
    text: "For an entity-pursuit route, remaining_steps counts moves still needed to reach a tile beside the target. Before the next step is consumed, remaining_steps + 1 is the current route distance to the target."
  - address: "0x005F4AA2"
    text: "The full reset has just advanced WorldPane +0x2C8. Target ID zero branches to 0x005F4AA8; a nonzero target branches to 0x005F4AAD. A hook replacing the six bytes through 0x005F4AA7 must replay this comparison and reach those untouched destinations without jumping into its own replacement bytes."
  - address: "0x005F4D0E"
    text: "Adjacency sends CAttack only when the local character already faces the target. Both the turn and attack branches continue to the common 100 ms pursuit-timer schedule."
  - address: "0x005F4D64"
    text: "Retain the target by u32 object ID, followed by its last resolved tile_y and tile_x at WorldPane +0x2C0 and +0x2C4."
  - address: "0x005F4D88"
    text: "Advance the generation for this pursuit attempt; the value accompanies timer ID 10 so callbacks from replaced paths are ignored."
  - address: "0x005F4DAF"
    text: "Unconditionally schedule one-shot pursuit timer ID 10 after 100 ms with target_id and generation callback values after any resolved-target branch, including turn, attack, failed path, and blocked movement. A later invocation requeues the chain."
  - address: "0x005F4F07"
    text: "Reset the fixed 400 by 400 predecessor-direction grid to unseen sentinel 5 before the breadth-first search."
  - address: "0x005F5034"
    text: "Expand cardinal neighbors in Direction order 0 through 3: Up, Right, Down, Left."
  - address: "0x005F50BC"
    text: "First visit records the direction from the current tile to this neighbor, then appends the neighbor to the FIFO queue."
  - address: "0x005F5127"
    text: "Walk predecessor directions backward from the reached goal to the start and append 12-byte direction plus source-coordinate records for reverse replay."
