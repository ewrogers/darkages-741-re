name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "docs/**"
      - "analysis/**"
      - "binaryninja/scripts/**"
      - "scripts/**"
      - "generated/**"
      - "theme/**"
      - "book.toml"
      - "README.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install mdBook
        env:
          MDBOOK_VERSION: 0.5.4
        run: |
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            --output mdbook.tar.gz
          tar -xzf mdbook.tar.gz
          chmod +x mdbook
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Test reference generation and publishing links
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          node --test scripts/tests/test_function_lookup.cjs

      - name: Check function references and exact lookup
        run: python3 scripts/build_function_reference.py --check

      - name: Check navigation and packet indexes
        run: python3 scripts/build_book_summary.py --check

      - name: Build mdBook
        run: mdbook build

      - name: Check rendered links and evidence targets
        run: python3 scripts/check_book_links.py book

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./book

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
